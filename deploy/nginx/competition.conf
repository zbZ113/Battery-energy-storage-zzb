limit_req_zone $binary_remote_addr zone=aily_mcp_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=aily_mcp_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /v1/aily/mcp/ {
        access_log off;
        return 308 https://$host$request_uri;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/quanxin-ecs-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quanxin-ecs-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 32m;

    location = /health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /v1/aily/mcp/ {
        allow 101.126.59.88;
        allow 101.126.59.89;
        allow 101.126.59.90;
        allow 101.126.59.91;
        allow 101.126.59.92;
        allow 122.14.241.34;
        allow 122.14.241.35;
        allow 122.14.241.36;
        allow 122.14.241.37;
        allow 122.14.241.38;
        allow 240e:b1:e401:3::a6;
        allow 240e:83:200::33c;
        allow 106.38.226.12;
        deny all;

        access_log off;
        client_max_body_size 256k;
        client_body_timeout 15s;
        limit_req zone=aily_mcp_per_ip burst=20 nodelay;
        limit_conn aily_mcp_connections 4;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Quanxin-Aily-Source-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
