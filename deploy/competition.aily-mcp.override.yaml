services:
  api:
    environment:
      QUANXIN_AILY_MCP_ENABLED: "true"
      QUANXIN_AILY_MCP_ENDPOINT_TOKEN_FILE: /run/secrets/aily_mcp_endpoint_token
      QUANXIN_AILY_MCP_IDENTITY_BINDINGS_FILE: /srv/quanxin/config/aily-mcp-identity-bindings.json
      QUANXIN_AILY_MCP_ALLOWED_SOURCE_IPS: ${AILY_MCP_ALLOWED_SOURCE_IPS}
    secrets:
      - aily_mcp_endpoint_token

secrets:
  aily_mcp_endpoint_token:
    file: ${QUANXIN_SECRETS_ROOT}/aily_mcp_endpoint_token
