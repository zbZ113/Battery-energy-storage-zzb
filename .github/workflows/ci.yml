name: Python quality gates

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and quality dependencies
        run: python -m pip install --upgrade "pip>=26.1.2,<27" "setuptools>=83" && python -m pip install -e ".[agents,auth,data,dev,knowledge,llm,ml,api,infrastructure,persistence,reporting,scenarios,mcp]"

      - name: Audit Python dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

      - name: Compile Python sources
        run: python -m compileall -q src deploy migrations

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run frontend lint
        run: pnpm lint

      - name: Run frontend type checking
        run: pnpm typecheck

      - name: Build the production frontend
        run: pnpm build
