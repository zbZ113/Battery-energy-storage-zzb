name: Python quality gates

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade "pip>=26.1.2,<27" && python -m pip install -e ".[agents,data,dev,ml,api,persistence]"

      - name: Audit Python dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

      - name: Compile Python sources
        run: python -m compileall -q src workbench deploy migrations
