name: Publish competition images to ACR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag, for example 2026.07.28-1
        required: true
        type: string
      public_origin:
        description: Public HTTPS origin baked into the Next.js client
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-acr-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLIC_ORIGIN: ${{ inputs.public_origin }}

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4

      - name: Validate immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]]
          [[ "${PUBLIC_ORIGIN}" =~ ^https://[^[:space:]]+$ ]]
          [[ -n "${ACR_REGISTRY}" ]]
          [[ -n "${ACR_NAMESPACE}" ]]

      - name: Sign in to the private ACR instance
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refuse an existing release tag
        shell: bash
        run: |
          set -euo pipefail
          for repository in \
            quanxin-backend \
            quanxin-frontend \
            quanxin-postgres \
            quanxin-redis \
            quanxin-nginx
          do
            reference="${ACR_REGISTRY}/${ACR_NAMESPACE}/${repository}:${RELEASE_TAG}"
            error_file="$(mktemp)"
            if docker buildx imagetools inspect "${reference}" >/dev/null 2>"${error_file}"; then
              echo "::error::Release tag already exists for ${repository}; choose a new immutable tag."
              rm -f "${error_file}"
              exit 1
            fi
            if ! grep -Eiq 'manifest unknown|not found|no such manifest' "${error_file}"; then
              cat "${error_file}" >&2
              rm -f "${error_file}"
              exit 1
            fi
            rm -f "${error_file}"
          done

      - name: Build and publish the backend runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/quanxin-backend:${{ inputs.release_tag }}
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}

      - name: Build and publish the frontend runtime
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/quanxin-frontend:${{ inputs.release_tag }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.public_origin }}
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}

      - name: Build and publish the gateway runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.gateway
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/quanxin-nginx:${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
          provenance: false

      - name: Mirror reviewed infrastructure images into private ACR
        shell: bash
        run: |
          set -euo pipefail
          mirror() {
            local source_image="$1"
            local target_repository="$2"
            docker pull "${source_image}"
            docker tag \
              "${source_image}" \
              "${ACR_REGISTRY}/${ACR_NAMESPACE}/${target_repository}:${RELEASE_TAG}"
            docker push \
              "${ACR_REGISTRY}/${ACR_NAMESPACE}/${target_repository}:${RELEASE_TAG}"
          }
          mirror "pgvector/pgvector:0.8.1-pg16" "quanxin-postgres"
          mirror "redis:7.4.2-alpine" "quanxin-redis"

      - name: Record immutable image digests
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ACR competition image release"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            for repository in \
              quanxin-backend \
              quanxin-frontend \
              quanxin-postgres \
              quanxin-redis \
              quanxin-nginx
            do
              reference="${ACR_REGISTRY}/${ACR_NAMESPACE}/${repository}:${RELEASE_TAG}"
              digest="$(docker buildx imagetools inspect "${reference}" \
                --format '{{json .Manifest.Digest}}' | tr -d '"')"
              echo "- \`${repository}@${digest}\`"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
