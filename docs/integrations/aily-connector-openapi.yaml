openapi: 3.1.0
info:
  title: Hiro Aily Connector
  version: project-bound-analysis-v2
  description: >-
    Reference-only facade over project-bound durable analysis jobs, audited
    ToolResults, and support-bounded battery operating scenarios. Every task is
    anchored to a completed Feishu upload run. The connector accepts scenario
    assumptions but never caller-supplied SOH, EOL, lifetime, or interval outputs.
servers:
  - url: https://YOUR_REVIEWED_HOST
security:
  - connectorBearer: []
paths:
  /v1/aily/scenario-contexts:
    post:
      operationId: createScenarioContext
      summary: Persist a support-bounded scenario against a verified data batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioContextRequest'
      responses:
        '201':
          description: Durable scenario context reference without internal route names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioContextState'
        '401':
          description: Connector authentication failed
        '422':
          description: Missing, inconsistent, unsupported, or unauthorized scenario input
        '503':
          description: Verified batch or scenario context persistence is unavailable
  /v1/aily/analysis-tasks:
    post:
      operationId: createAnalysisTask
      summary: Create an analysis task from one registered server-side reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisTaskRequest'
      responses:
        '202':
          description: Durable Agent run reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunState'
        '401':
          description: Connector authentication failed
        '422':
          description: Task request rejected
        '503':
          description: Durable task gateway unavailable
  /v1/aily/analysis-tasks/{run_id}:
    get:
      operationId: getAnalysisTask
      summary: Get the durable state of an analysis task
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Existing Agent run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunState'
        '401':
          description: Connector authentication failed
        '404':
          description: Task not found
  /v1/aily/analysis-tasks/{run_id}/results/{result_id}:
    get:
      operationId: getAuditedResult
      summary: Get a run-bound ledger-registered ToolResult
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revalidated ToolResult including exact provenance and versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
        '401':
          description: Connector authentication failed
        '404':
          description: Result is absent, invalid, or not bound to the run
        '409':
          description: Result exists but audit authorization rejects display
  /v1/aily/analysis-tasks/{run_id}/reports/{report_result_id}:
    get:
      operationId: getAuditedReport
      summary: Download a run-bound audited Markdown report
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: report_result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SHA-verified audited report artifact
          content:
            text/markdown:
              schema:
                type: string
        '401':
          description: Connector authentication failed
        '404':
          description: Report is absent, invalid, or not bound to the run
        '409':
          description: Report result is unauthorized or artifact integrity failed
components:
  securitySchemes:
    connectorBearer:
      type: http
      scheme: bearer
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateAnalysisTaskRequest:
      oneOf:
        - $ref: '#/components/schemas/BatchAnalysisTaskRequest'
        - $ref: '#/components/schemas/ScenarioAnalysisTaskRequest'
      discriminator:
        propertyName: task_type
        mapping:
          predict_cycle_life: '#/components/schemas/BatchAnalysisTaskRequest'
          predict_soh_trajectory: '#/components/schemas/BatchAnalysisTaskRequest'
          compare_operation_scenarios: '#/components/schemas/ScenarioAnalysisTaskRequest'
          project_storage_lifetime: '#/components/schemas/ScenarioAnalysisTaskRequest'
    BatchAnalysisTaskRequest:
      type: object
      additionalProperties: false
      required: [task_type, source_run_id, data_batch_id]
      properties:
        task_type:
          type: string
          enum:
            - predict_cycle_life
            - predict_soh_trajectory
        source_run_id:
          $ref: '#/components/schemas/SafeReference'
        data_batch_id:
          $ref: '#/components/schemas/SafeReference'
    ScenarioAnalysisTaskRequest:
      type: object
      additionalProperties: false
      required: [task_type, source_run_id, scenario_context_id]
      properties:
        task_type:
          type: string
          enum:
            - compare_operation_scenarios
            - project_storage_lifetime
        source_run_id:
          $ref: '#/components/schemas/SafeReference'
        scenario_context_id:
          $ref: '#/components/schemas/SafeReference'
    CreateScenarioContextRequest:
      oneOf:
        - $ref: '#/components/schemas/CompareScenarioContextRequest'
        - $ref: '#/components/schemas/ProjectLifetimeScenarioContextRequest'
      discriminator:
        propertyName: task_type
        mapping:
          compare_operation_scenarios: '#/components/schemas/CompareScenarioContextRequest'
          project_storage_lifetime: '#/components/schemas/ProjectLifetimeScenarioContextRequest'
    CompareScenarioContextRequest:
      type: object
      additionalProperties: false
      required: [task_type, source_run_id, data_batch_id, cell_format, baseline, comparisons]
      properties:
        task_type:
          const: compare_operation_scenarios
        source_run_id:
          $ref: '#/components/schemas/SafeReference'
        data_batch_id:
          $ref: '#/components/schemas/SafeReference'
        cell_format:
          $ref: '#/components/schemas/CellFormat'
        current_state_reference:
          oneOf:
            - $ref: '#/components/schemas/ScenarioStateReference'
            - type: 'null'
        baseline:
          $ref: '#/components/schemas/OperationScenario'
        comparisons:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/OperationScenario'
    ProjectLifetimeScenarioContextRequest:
      type: object
      additionalProperties: false
      required: [task_type, source_run_id, data_batch_id, cell_format, scenario]
      properties:
        task_type:
          const: project_storage_lifetime
        source_run_id:
          $ref: '#/components/schemas/SafeReference'
        data_batch_id:
          $ref: '#/components/schemas/SafeReference'
        cell_format:
          $ref: '#/components/schemas/CellFormat'
        current_state_reference:
          oneOf:
            - $ref: '#/components/schemas/ScenarioStateReference'
            - type: 'null'
        scenario:
          $ref: '#/components/schemas/OperationScenario'
        new_observation_reference:
          oneOf:
            - $ref: '#/components/schemas/ScenarioStateReference'
            - type: 'null'
    OperationScenario:
      type: object
      additionalProperties: false
      required:
        - scenario_id
        - scenario_version
        - horizon_years
        - eol_threshold
        - segments
      properties:
        scenario_id:
          type: string
          minLength: 1
          maxLength: 100
        scenario_version:
          type: string
          minLength: 1
          maxLength: 100
        horizon_years:
          type: integer
          minimum: 1
          maximum: 25
        eol_threshold:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        segments:
          type: array
          minItems: 1
          description: Contiguous segments starting at year zero and covering the horizon.
          items:
            $ref: '#/components/schemas/ScenarioSegment'
    ScenarioSegment:
      type: object
      additionalProperties: false
      required:
        - segment_id
        - start_year
        - end_year
        - temperature_c
        - charge_c_rate
        - discharge_c_rate
        - soc_lower_bound
        - soc_upper_bound
        - dod
        - equivalent_full_cycles_per_year
        - rest_duration_hours
      properties:
        segment_id: {type: string, minLength: 1, maxLength: 100}
        start_year: {type: integer, minimum: 0, maximum: 24}
        end_year: {type: integer, minimum: 1, maximum: 25}
        temperature_c: {type: number}
        charge_c_rate: {type: number, exclusiveMinimum: 0}
        discharge_c_rate: {type: number, exclusiveMinimum: 0}
        soc_lower_bound: {type: number, minimum: 0, exclusiveMaximum: 1}
        soc_upper_bound: {type: number, exclusiveMinimum: 0, maximum: 1}
        dod:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: Must equal soc_upper_bound minus soc_lower_bound.
        equivalent_full_cycles_per_year: {type: number, minimum: 0}
        rest_duration_hours: {type: number, minimum: 0}
    ScenarioStateReference:
      type: object
      additionalProperties: false
      required: [result_id, json_path]
      properties:
        result_id: {type: string, format: uuid}
        json_path:
          type: string
          pattern: '^values\.'
    ScenarioContextState:
      type: object
      additionalProperties: false
      required:
        - scenario_context_id
        - task_type
        - data_batch_id
        - input_sha256
        - created_at
      properties:
        scenario_context_id:
          $ref: '#/components/schemas/SafeReference'
        task_type:
          type: string
          enum: [compare_operation_scenarios, project_storage_lifetime]
        data_batch_id:
          $ref: '#/components/schemas/SafeReference'
        input_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        created_at: {type: string, format: date-time}
    CellFormat:
      type: string
      enum: [cylindrical, prismatic]
    SafeReference:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
    AgentRunState:
      type: object
      description: Existing quanxin_life.core.AgentRunState contract.
      required: [run_id, intent_id, plan_hash, status, result_ids, updated_at]
      additionalProperties: true
      properties:
        run_id: {type: string}
        intent_id: {type: string}
        plan_hash: {type: string}
        status: {type: string}
        result_ids:
          type: array
          items: {type: string}
        updated_at: {type: string, format: date-time}
    ToolResult:
      type: object
      description: >-
        Existing quanxin_life.core.ToolResult resolved from the audit ledger.
        Business numbers are returned only inside this registered contract.
      required:
        - result_id
        - tool_name
        - tool_version
        - input_hash
        - values
        - warnings
        - provenance
        - created_at
      additionalProperties: true
      properties:
        result_id: {type: string}
        tool_name: {type: string}
        tool_version: {type: string}
        model_version: {type: [string, 'null']}
        data_version: {type: [string, 'null']}
        feature_version: {type: [string, 'null']}
        input_hash: {type: string}
        values: {type: object}
        warnings:
          type: array
          items: {type: string}
        provenance:
          type: array
          items: {type: object}
        created_at: {type: string, format: date-time}
