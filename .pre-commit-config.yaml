repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
      - id: compileall
        name: compileall
        entry: python -m compileall -q src workbench deploy
        language: system
        pass_filenames: false
