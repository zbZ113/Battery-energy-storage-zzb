[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanxin-life"
version = "0.1.0"
description = "Multi-agent battery cell life prediction and degradation-aware decision platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
agents = [
  "langgraph>=1.2.9,<2",
  "langchain-core>=1.2.22,<2",
  "langgraph-checkpoint>=4.1.1,<5",
  "langgraph-checkpoint-postgres>=3.1.2,<4",
  "langgraph-sdk>=0.3.15,<0.5",
]
auth = ["argon2-cffi>=25.1,<26"]
api = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]
data = [
  "duckdb>=1.1,<2",
  "h5py>=3.12,<4",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=23.0.1,<24",
  "scipy>=1.14,<2",
]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pip-audit>=2.10,<3",
  "pre-commit>=4,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
]
ml = [
  "safetensors>=0.5,<1",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "xgboost>=2.1,<3",
]
training = [
  "matplotlib>=3.9,<4",
  "mlflow>=3,<4",
  "psutil>=6,<8",
]
llm = ["httpx>=0.27,<1", "jsonschema>=4.20,<5"]
knowledge = ["pymupdf>=1.26,<2"]
mcp = ["mcp==1.28.1"]
infrastructure = [
  "celery[redis]>=5.6,<6",
  "minio>=7.2.20,<8",
  "redis>=6.4,<6.5",
]
persistence = [
  "SQLAlchemy>=2,<3",
  "Alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
]
physics = ["pybamm==25.12.2"]
reporting = [
  "pypdf>=6.15,<7",
  "python-docx>=1.2,<2",
  "reportlab>=4.4,<5",
]
scenarios = [
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
]
streamlit = ["httpx>=0.27,<1", "plotly>=5.24,<7", "streamlit>=1.40,<2"]
tooling = ["dvc>=3.58,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanxin_life.scenarios" = ["manifests/*.json"]
"quanxin_life._vendor.blast_lite" = ["LICENSE", "NOTICE", "UPSTREAM.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/quanxin_life/_vendor/blast_lite"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
exclude = "^src/quanxin_life/_vendor/blast_lite/(degradation_model|lfp_gr_250AhPrismatic_2019|lfp_gr_SonyMurata3Ah_2018|rainflow)\\.py$"
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["quanxin_life"]
