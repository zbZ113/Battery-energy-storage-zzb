[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanxin-life"
version = "0.1.0"
description = "Multi-agent battery cell life prediction and degradation-aware decision platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2,<1", "langchain-core>=0.3,<1"]
api = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]
data = [
  "duckdb>=1.1,<2",
  "dvc>=3.58,<4",
  "h5py>=3.12,<4",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=18,<20",
  "scipy>=1.14,<2",
]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]
ml = ["scikit-learn>=1.5,<2", "torch>=2.5,<3", "xgboost>=2.1,<3"]
mcp = ["mcp>=1.27,<2"]
physics = ["pybamm>=24.11,<26"]
streamlit = ["plotly>=5.24,<7", "streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["quanxin_life"]
